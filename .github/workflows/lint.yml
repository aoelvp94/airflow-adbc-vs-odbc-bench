name: Lint DAGs

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends unixodbc-dev

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          CONSTRAINT_URL="https://raw.githubusercontent.com/apache/airflow/constraints-3.3.2/constraints-3.12.txt"
          # Arrow provider 0.1.1 requires apache-airflow>=2.11.0; pin AF 3.3.2 with official constraints.
          pip install "apache-airflow==3.3.2" --constraint "${CONSTRAINT_URL}"
          pip install -r requirements.txt --constraint "${CONSTRAINT_URL}"

      - name: Lint with flake8
        run: |
          pip install flake8
          flake8 dags/ include/operators/ --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 dags/ include/operators/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Unit test AdbcArrowTransfer vs GenericTransfer
        run: |
          pip install pytest
          PYTHONPATH=include pytest tests/ -q

      - name: Validate DAGs (dry-import)
        run: |
          export AIRFLOW_HOME=$(pwd)
          export AIRFLOW__CORE__DAGS_FOLDER=$(pwd)/dags
          export AIRFLOW__CORE__LOAD_EXAMPLES=False
          python -c "
          import importlib.util
          import os
          import sys

          sys.path.insert(0, os.path.join(os.getcwd(), 'include'))

          dag_files = [
              'bench_bulk_insert.py',
              'bench_bulk_select.py',
              'bench_transfer.py',
              'bench_sql_operators.py',
              'bench_duckdb.py',
              'bench_sqlite.py',
          ]
          for dag_file in dag_files:
              print(f'Checking {dag_file}...')
              path = os.path.join('dags', dag_file)
              spec = importlib.util.spec_from_file_location(dag_file[:-3], path)
              module = importlib.util.module_from_spec(spec)
              spec.loader.exec_module(module)
              print(f'{dag_file} parsed successfully')
          print('All DAGs are valid')
          "
