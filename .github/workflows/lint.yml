name: Lint DAGs

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends unixodbc-dev

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Arrow provider 0.1.1 requires apache-airflow>=2.11.0. 2.11.2 is the latest 2.x.
          pip install apache-airflow==2.11.2
          pip install -r requirements.txt

      - name: Lint with flake8
        run: |
          pip install flake8
          flake8 dags/ --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 dags/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Validate DAGs (dry-import)
        run: |
          export AIRFLOW_HOME=$(pwd)
          export AIRFLOW__CORE__DAGS_FOLDER=$(pwd)/dags
          export AIRFLOW__CORE__LOAD_EXAMPLES=False
          python -c "
          import os
          import sys

          sys.path.insert(0, os.path.join(os.getcwd(), 'dags'))
          sys.path.insert(0, os.path.join(os.getcwd(), 'include'))

          dag_files = [
              'bench_bulk_insert.py',
              'bench_bulk_select.py',
              'bench_transfer.py',
              'bench_sql_operators.py',
              'bench_duckdb.py',
              'bench_sqlite.py',
          ]
          for dag_file in dag_files:
              print(f'Checking {dag_file}...')
              with open(f'dags/{dag_file}') as f:
                  exec(compile(f.read(), dag_file, 'exec'))
              print(f'{dag_file} parsed successfully')
          print('All DAGs are valid')
          "
